site_name: Prep Hub
site_url: https://preparation.kabyik.dev/
site_author: Kabyik Kayal
site_description: >-
  A searchable knowledge and exam-preparation hub — viva questions, revision
  notes, interview prep, and technical cheat sheets.

repo_name: Kabyik-Kayal/preparation
repo_url: https://github.com/Kabyik-Kayal/preparation
edit_uri: edit/main/docs/

copyright: >-
  © Kabyik Kayal — <a href="https://kabyik.dev">kabyik.dev</a>

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  # Disable Material's Google Fonts fetches so strict builds stay offline-safe.
  font: false
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - tags
  # Downloads external assets (Google Fonts, the MathJax CDN script) at build
  # time and rewrites pages to serve them from this origin. Removes the
  # render-blocking fonts.googleapis.com / cdn.jsdelivr.net round trips that
  # were adding real latency to first paint, especially on slower networks.
  - privacy

markdown_extensions:
  # Core niceties
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  # PyMdown extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  # tex-chtml, not tex-mml-chtml: the pages only ever author TeX, and leaving
  # the MathML *input* jax out keeps a re-typeset from picking up the assistive
  # MathML that MathJax emits itself (which rendered every equation twice).
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Kabyik-Kayal
    - icon: fontawesome/solid/globe
      link: https://kabyik.dev

nav:
  - Home: index.md
  - MAD 2 Project:
    - MAD2-Project/index.md
    - Viva preparation guide: MAD2-Project/preparation.md
    - Viva module notes: MAD2-Project/Viva-Preparation-Module.md
    - Vue Router coding task: MAD2-Project/Viva-Coding-Task-VueRouter-Users.md
  - MLF:
    - MLF/index.md
    - MLF Quiz 1: MLF/MLF_Quiz1.md
    - MLF Quiz 2: MLF/MLF_Quiz2.md
  - MLT:
    - MLT/index.md
    - MLT Quiz 1: MLT/MLT_Quiz1.md
    - MLT Quiz 2: MLT/MLT_Quiz2.md
  - NPTEL Ethical Hacking: NPTEL-Ethical-Hacking/index.md
  - Tags: tags.md
